# Builds LLVM for six machines and puts the result out as a release, so a
# project that needs LLVM downloads one rather than having one installed.
#
# What comes out is an install prefix, not a pile of files: include/, lib/, and
# lib/cmake. That is what 'find_package(LLVM CONFIG)' wants, so a build using
# it points CMAKE_PREFIX_PATH at the unpacked directory and changes nothing
# else.
#
# **There is nothing to choose when running it.** It was written with an input
# for everything opinionated, and every one of them has been settled: the
# latest LLVM, X86 and AArch64, lld, no system libraries, bindings, and a
# release rather than a draft. What that bought was a run where the only way to
# get the wrong asset was to fill the form in wrong - which happened - against
# nothing, since nobody wanted any other combination. Anyone who does can edit
# the two lines below, in a commit that says why.
name: Build LLVM

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Semicolon separated, or 'all'. What is not built here is a triple the
  # result takes and then says it knows nothing of, so this is what "can be
  # compiled for" comes to for whoever uses it.
  TARGETS: X86;AArch64

  # lld, so a project linking through it needs no linker of its own.
  PROJECTS: lld

jobs:
  # Settled once and handed to everything else, so that a run cannot have one
  # machine build one version and another a newer one.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.settle.outputs.tag }}
      version: ${{ steps.settle.outputs.version }}

    steps:
      - name: Settle which LLVM this run is for
        id: settle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The highest version, not the one published most recently. Those
          # are different: GitHub calls the newest non-prerelease "latest",
          # and llvm-project goes on patching the previous branch after a new
          # one is out - so 22.1.9 landing after 23.1.0 would take the name
          # and quietly build the older half of the project.
          #
          # Prereleases are dropped because every release candidate is
          # tagged, and 'sort -V' orders what is left by version.
          tag=$(gh api repos/llvm/llvm-project/releases --paginate --jq '.[] | select(.prerelease == false and .draft == false) | .tag_name' | sed 's/^llvmorg-//' | sort -V | tail -1)
          tag="llvmorg-$tag"

          echo "Building $tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#llvmorg-}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    # LLVM is hours of work. 360 is the ceiling GitHub allows on a hosted
    # runner, and a build that reaches it has gone wrong rather than been slow.
    timeout-minutes: 360

    strategy:
      # One machine failing says nothing about the others, and rebuilding the
      # whole matrix to get one of them is hours wasted each time.
      fail-fast: false
      matrix:
        # The oldest image each machine still offers, on purpose. What is built
        # here is run somewhere else, and a shared library built against a
        # newer C library will not load against an older one - so the oldest
        # image that is still supported is the one that reaches furthest.
        # Newer images exist for all of these and none of them buys anything.
        #
        # The arm runners are free on public repositories and billed on private
        # ones. Drop them from here if this repository ever stops being public.
        include:
          - name: linux-x64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
          - name: windows-x64
            runner: windows-2022
          - name: windows-arm64
            runner: windows-11-arm
          - name: macos-arm64
            runner: macos-15
          - name: macos-x64
            runner: macos-15-intel

    steps:
      - name: Take this repository, for the shim
        uses: actions/checkout@v7
        with:
          path: build-llvm

      - name: Take the LLVM this run is for
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ needs.version.outputs.tag }}
          path: llvm-project

      - name: Say where the compiler is, on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # It targets x64 whatever it is running on, so the arm runner has to
          # say so or it builds an x64 LLVM and names it arm64.
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      # The system libraries are the ones worth understanding: LLVM built
      # against zlib, zstd and libxml2 drags all three along as shared
      # libraries that then have to sit beside whatever links it, and a set of
      # them missing one loads no further than the first attempt. Built
      # without, there is nothing to carry.
      - name: Work out how to build it
        shell: bash
        run: |
          # LLVM refuses to configure rather than working out how to package
          # the C API, and wants it asked for differently on each machine:
          # libLLVM.so already exports only the C API, MSVC cannot build it
          # and needs the separate one, and Darwin wants both.
          case "$RUNNER_OS" in
            Windows) SHARED=(-DLLVM_BUILD_LLVM_C_DYLIB=ON) ;;
            macOS)   SHARED=(-DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_BUILD_LLVM_C_DYLIB=ON) ;;
            *)       SHARED=(-DLLVM_BUILD_LLVM_DYLIB=ON) ;;
          esac

          cmake -S llvm-project/llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DLLVM_ENABLE_PROJECTS="$PROJECTS" \
            -DLLVM_TARGETS_TO_BUILD="$TARGETS" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_DIA_SDK=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            "${SHARED[@]}"

      # LLVM_ENABLE_DIA_SDK is off, and that one is not a size decision like
      # the rest of them - **it is what makes the Windows asset usable at all.**
      #
      # Built with it on, LLVMDebugInfoPDB is exported carrying a link
      # dependency on DIASDK::Diaguids, and LLVMConfig.cmake looks for the DIA
      # SDK when it is loaded. On a machine that has not got it - which is any
      # machine without a full Visual Studio - the target is never defined,
      # find_package(LLVM) fails on a dangling target, and nothing downstream
      # configures at all. The 23.1.0 asset went out that way and could not be
      # built against on Windows.
      #
      # What is given up is reading PDBs through LLVM, which is a thing a
      # debugger does rather than a thing a compiler does.

      - name: Build it
        run: cmake --build build --parallel

      - name: Put it where it is going
        run: cmake --install build

      # lld has no C interface of its own - its entry points are C++ in static
      # libraries, so nothing outside C++ can reach the linker however well it
      # can reach the rest of LLVM through llvm-c. The shim is the whole of what
      # fills that gap, and building it here rather than in whatever project
      # wants it means: one build per platform instead of one per developer, no
      # C++ toolchain needed downstream, and a shim that cannot be a version
      # behind the LLVM it wraps.
      #
      # A configure of its own against the installed prefix, which is also the
      # cheapest possible check that the prefix works: it finds LLVM and lld the
      # same way every other consumer will.
      - name: Build the C interface to lld
        shell: bash
        run: |
          cmake -S build-llvm/shim -B shim-build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_PREFIX_PATH="$PWD/install"             -DCMAKE_INSTALL_PREFIX="$PWD/install"

          cmake --build shim-build --parallel
          cmake --install shim-build

      # The tools are not built rather than built and then deleted: it saves
      # the build time as well as the size, and leaves no exported CMake target
      # naming a file that is not there, which would stop 'find_package' rather
      # than being ignored. What is kept is the C API shared library, which is
      # what anything binding to LLVM loads by name.
      - name: Say what was kept
        shell: bash
        run: |
          ls -la install/bin || echo "nothing in bin, which is where only Windows puts anything"
          ls -la install/lib

      # A binding loads the library by the name 'LLVM-C'. Only Linux has no
      # file of that name, so it fails at the first call rather than at build.
      - name: Give the library the name a binding loads it by
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f install/lib/libLLVM.so
          ln -s libLLVM.so install/lib/libLLVM-C.so
          ls -la install/lib/libLLVM*

      # What a project consuming this actually does first, and the failure it
      # would otherwise meet hours later on its own machine. Cheap here: it
      # reads the exported CMake and nothing more.
      # Building the shim above already proved find_package works, this one
      # having been what caught the DIA SDK. Kept as a step of its own because
      # it says so in one line if it ever stops.
      - name: Check the result can be built against
        shell: bash
        run: |
          mkdir -p check
          cd check

          cat > CMakeLists.txt <<'END'
          cmake_minimum_required(VERSION 3.20)
          project(check LANGUAGES CXX)
          find_package(LLVM REQUIRED CONFIG)
          find_package(LLD REQUIRED CONFIG)
          message(STATUS "found LLVM ${LLVM_PACKAGE_VERSION} and lld")
          END

          cmake -S . -B build -DCMAKE_PREFIX_PATH="$PWD/../install"

      - name: Take the debug information out, where it can be taken out
        if: runner.os != 'Windows'
        shell: bash
        run: find install/lib -name '*.a' -exec strip -S {} +

      - name: Say how big it came out
        shell: bash
        run: du -sh install

      - name: Wrap it up
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MACHINE: ${{ matrix.name }}
        run: |
          asset="llvm-$VERSION-$MACHINE.tar.zst"

          mv install llvm
          tar -c llvm | zstd -19 -T0 -o "$asset"

          # Read it back here, so an asset that will not open is a failed run
          # rather than something found on the way into a release.
          zstd -dc "$asset" | tar -t > /dev/null

          ls -la "$asset"

      - name: Hand it over
        uses: actions/upload-artifact@v7
        with:
          name: llvm-${{ matrix.name }}
          path: llvm-${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.zst
          # Compressed already, and asking the upload to do it again costs
          # minutes and saves nothing.
          compression-level: 0

  # The declarations a C# caller of the C API needs, read out of the headers
  # this run just built rather than taken from a package that tracks its own
  # version. That is the point of doing it here: the declarations and the
  # library cannot then disagree, and a mismatch between them fails at run time
  # rather than at build - a removed export throws on first call, and a changed
  # enum or layout does not throw at all.
  bindings:
    name: Bindings
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Take this repository, for the script that prepares them
        uses: actions/checkout@v7

      - name: Take the headers that were just built
        uses: actions/download-artifact@v8
        with:
          name: llvm-linux-x64

      - name: Unpack them
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: tar --zstd -xf "llvm-$VERSION-linux-x64.tar.zst"

      # ClangSharp is versioned to match the LLVM it reads. Where there is no
      # tool of exactly that version, the newest will read the headers
      # perfectly well - it is a C parser, not a table of what LLVM contains.
      - name: Fetch the generator
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet tool install --global ClangSharpPInvokeGenerator --version "$VERSION" \
            || dotnet tool install --global ClangSharpPInvokeGenerator

      - name: Read the declarations out of the headers
        run: |
          include="$PWD/llvm/include"
          headers=$(find "$include/llvm-c" -name '*.h' | sort)

          mkdir -p bindings/llvm-c

          # libclang carries no builtin headers of its own, so without the
          # resource directory of an installed clang every header that reaches
          # stddef.h is skipped - which is all but four of them.
          resource=$(clang -print-resource-dir)
          test -f "$resource/include/stddef.h"

          # Both --file and --traverse for every header: with --file alone the
          # generator emits only what the named file declares itself, and the
          # C API is spread across all of them. The cost is that a header
          # pulled in by several others is emitted once per header that pulled
          # it, which the next step takes back out.
          #
          # The namespace is not LLVM.Interop, and that is deliberate. The class
          # holding the declarations is called LLVM, so a namespace with a
          # segment of that name shadows it and 'LLVM.LLVMAddFunction(...)'
          # reads as the namespace - which does not compile. LlvmC is a
          # different word rather than the same one differently cased, and says
          # which library is on the other side.
          ClangSharpPInvokeGenerator \
            $(for one in $headers; do echo --file "$one"; done) \
            $(for one in $headers; do echo --traverse "$one"; done) \
            --file-directory "$include" \
            --include-directory "$include" \
            --resource-directory "$resource" \
            --output bindings/llvm-c \
            --namespace LlvmC.Interop \
            --library-path LLVM-C \
            --method-class-name LLVM \
            --config codegen=latest file=multi \
            --generate helper-types \
            2>&1 | tee generator.log || true

          # The status is a count of warnings when the run went well and a
          # negative number when it was not, and the shell cannot tell those
          # apart once it has truncated them to a byte - so the log decides.
          # A header it could not read is one it says it is skipping.
          if grep -q '^Skipping \|^    Error ' generator.log; then
            echo "the generator did not read every header"
            exit 1
          fi

      # The same again for lld, whose C interface this run built. It is one
      # header rather than thirty, so none of what the LLVM ones need applies:
      # nothing is repeated and nothing is declared by a macro.
      #
      # **A directory of its own, and that is not tidiness.** The generator
      # emits helper types - NativeTypeName above all, which every declaration
      # it writes carries - into whichever namespace it was told. Two sets
      # sharing a directory gives one of two failures: with helper types asked
      # for twice, the second NativeTypeNameAttribute.cs writes over the first;
      # asked for once, the set that did not get them cannot see the attribute,
      # it being internal to the other namespace. The second is what the first
      # run out of this workflow hit.
      - name: Read the declarations out of the shim's header
        run: |
          include="$PWD/llvm/include"
          resource=$(clang -print-resource-dir)

          mkdir -p bindings/lld-c

          ClangSharpPInvokeGenerator \
            --file "$include/lld-c/Driver.h" \
            --traverse "$include/lld-c/Driver.h" \
            --file-directory "$include" \
            --include-directory "$include" \
            --resource-directory "$resource" \
            --output bindings/lld-c \
            --namespace LldC.Interop \
            --library-path lld-c \
            --method-class-name LLD \
            --config codegen=latest file=multi \
            --generate helper-types \
            2>&1 | tee shim-generator.log || true

          if grep -q '^Skipping \|^    Error ' shim-generator.log; then
            echo "the generator did not read the shim's header"
            exit 1
          fi

      # What comes out does not compile, for two reasons that have nothing to
      # do with each other: every declaration is emitted once per header that
      # pulled it in, and the target-initialising functions are called by the
      # wrappers and declared by no header at all. Both are dealt with here so
      # that no project using these has to work them out again. The script says
      # why in full.
      #
      # The namespace is told to it rather than read off a file, there being two
      # of them now and the target-initialising declarations belonging with
      # LLVM's.
      - name: Make them compile
        run: python3 .github/scripts/prepare-bindings.py bindings/llvm-c "$TARGETS" LlvmC.Interop

      # Building them here is what makes the two fixes above a checked claim
      # rather than a hope. A generator that changes what it emits, or a target
      # list nobody thought about, fails in this run instead of in whatever
      # project unpacks the asset next.
      - name: Check they compile
        run: |
          mkdir -p check
          cd check

          cat > check.csproj <<'END'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <Nullable>disable</Nullable>
              <NoWarn>CS0108;CS0109;CS0169;CS0649;CS8981</NoWarn>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="../bindings/**/*.cs" />
            </ItemGroup>
          </Project>
          END

          dotnet build --nologo

      - name: Say what came out
        run: echo "$(find bindings -name '*.cs' | wc -l) files, $(grep -rh DllImport bindings | wc -l) declarations"

      - name: Wrap them up
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: tar -c bindings | zstd -19 -T0 -o "llvm-$VERSION-bindings-csharp.tar.zst"

      - name: Hand them over
        uses: actions/upload-artifact@v7
        with:
          name: bindings-csharp
          path: llvm-${{ needs.version.outputs.version }}-bindings-csharp.tar.zst
          compression-level: 0

  release:
    name: Release
    needs: [version, build, bindings]
    runs-on: ubuntu-latest
    # Whatever was built is worth releasing. A machine that failed is a machine
    # to look at, not a reason to throw away the ones that worked.
    if: always() && needs.build.result == 'success'

    steps:
      - name: Gather what was built
        uses: actions/download-artifact@v8
        with:
          path: built
          merge-multiple: true

      - name: Put it out under the version it is
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: "LLVM ${{ needs.version.outputs.version }}. Back ends: ${{ env.TARGETS }}. Projects: ${{ env.PROJECTS }}. No system libraries, no tools. Each asset unpacks to an 'llvm' install prefix - point CMAKE_PREFIX_PATH at it."
        run: |
          # Building the same version twice is an ordinary thing to do - a
          # machine failed, or something here changed - so the second run
          # replaces what the first put out rather than refusing.
          if gh release view "$VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" built/*.tar.zst --repo "$REPOSITORY" --clobber
          else
            gh release create "$VERSION" built/*.tar.zst \
              --repo "$REPOSITORY" \
              --title "LLVM $VERSION" \
              --notes "$NOTES"
          fi
